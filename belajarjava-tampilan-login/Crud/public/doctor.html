<!DOCTYPE html>
<html>
<head>
  <title>List Doctor</title>
</head>
<body>
  <h1>👨‍⚕️ List Doctor</h1>

  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Nama</th>
        <th>Spesialis</th>
        <th>No HP</th>
      </tr>
    </thead>
    <tbody id="doctorBody"></tbody>
  </table>

  <script>
    async function loadDoctor() {
      const res = await fetch('/api/doctors');
      const result = await res.json();

      const body = document.getElementById('doctorBody');
      body.innerHTML = '';

      result.data.forEach(d => {
        body.innerHTML += `
          <tr>
            <td>${d.id_dokter}</td>
            <td>${d.username}</td>
            <td>${d.nama}</td>
            <td>${d.spesialis}</td>
            <td>${d.no_hp}</td>
            <button onclick="deleteDoctor(${d.id_dokter})">Hapus</button>
            <button onclick="editDoctor(${d.id_dokter})">Edit</button>
          </tr>
        `;
      });
    }
    async function deleteDoctor(id) {
  if (!confirm('Hapus doctor ini?')) return;

  await fetch(`/api/doctor/${id}`, { method: 'DELETE' });
  alert('Doctor dihapus');
}

async function editDoctor(id) {
  const nama = prompt('Nama:');
  if (nama === null) return;

  const spesialis = prompt('spesialis:');
  if (spesialis === null) return;
  
  const no_hp = prompt('No HP:');
  if (no_hp === null) return;

  await fetch(`/api/doctor/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nama, spesialis, no_hp })

</body>
</html>
