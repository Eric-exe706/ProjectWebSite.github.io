<!DOCTYPE html>
<html>
<head>
  <title>List Nurse</title>
</head>
<body>
  <h1>👩‍⚕️ List Nurse</h1>

  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Nama</th>
        <th>Shift</th>
        <th>No HP</th>
      </tr>
    </thead>
    <tbody id="nurseBody"></tbody>
  </table>

  <script>
    async function loadNurse() {
      const res = await fetch('/api/nurses');
      const result = await res.json();

      const body = document.getElementById('nurseBody');
      body.innerHTML = '';

      result.data.forEach(n => {
        body.innerHTML += `
          <tr>
            <td>${n.id_nurse}</td>
            <td>${n.username}</td>
            <td>${n.nama}</td>
            <td>${n.shift}</td>
            <td>${n.no_hp}</td>
            <button onclick="deleteNurse(${n.id_nurse})">Hapus</button>
          </tr>
        `;
      });
    }
    async function deleteNurse(id) {
  if (!confirm('Hapus Nurse ini?')) return;

  await fetch(`/api/nurse/${id}`, { method: 'DELETE' });
  alert('Nurse dihapus');
}

    loadNurse();
  </script>
</body>
</html>
